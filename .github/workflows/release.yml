name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag injected at build time (e.g. v0.3.0 or v0.3.0-rc.1)'
        required: true
        type: string
      prerelease:
        description: 'Mark as a prerelease'
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate release version and unused tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          python3 packaging/versioning.py --tag "$RELEASE_TAG" --prerelease "$PRERELEASE" --output build/release-version.json
          python3 - <<'PY'
          import json, os
          info = json.load(open('build/release-version.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('version=' + info['version'] + '\n')
          PY
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" > /tmp/release-refs.json
          python3 - <<'PY'
          import json, os
          refs = json.load(open("/tmp/release-refs.json"))
          if any(r["ref"] == "refs/tags/" + os.environ["RELEASE_TAG"] for r in refs):
              raise SystemExit("Tag already exists; releases never overwrite existing tags")
          PY
  build:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.validate.outputs.version }}
  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gatehouse-packages-${{ github.sha }}
          path: dist
      - name: Verify checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          python3 packaging/verify_release.py "dist/$RELEASE_VERSION" "$RELEASE_VERSION" "$GITHUB_SHA"
          cd "dist/$RELEASE_VERSION"
          sha256sum --check SHA256SUMS
          args=()
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Gatehouse $RELEASE_TAG" \
            --generate-notes \
            "${args[@]}"
  documentation:
    needs: [validate, publish]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      channel: ${{ inputs.prerelease && 'prerelease' || 'release' }}
