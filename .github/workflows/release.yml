name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching the source version (for example v0.2.1)'
        required: true
        type: string
      prerelease:
        description: 'Mark as a prerelease'
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate release version and unused tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import ast, os, pathlib, re
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit("Tag must have the form vMAJOR.MINOR.PATCH")
          source = pathlib.Path("internal/gh/config.go").read_text()
          version = re.search(r'const Version = "([^"]+)"', source).group(1)
          tree = ast.parse(pathlib.Path("packaging/build.py").read_text())
          package_version = next(ast.literal_eval(n.value) for n in tree.body
              if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == "VERSION" for t in n.targets))
          if tag != "v" + version or package_version != version:
              raise SystemExit("Tag, source version and package version must match")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("version=" + version + "\n")
          PY
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" > /tmp/release-refs.json
          python3 - <<'PY'
          import json, os
          refs = json.load(open("/tmp/release-refs.json"))
          if any(r["ref"] == "refs/tags/" + os.environ["RELEASE_TAG"] for r in refs):
              raise SystemExit("Tag already exists; releases never overwrite existing tags")
          PY
  build:
    needs: validate
    uses: ./.github/workflows/ci.yml
  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gatehouse-packages-${{ github.sha }}
          path: dist
      - name: Verify checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          cd "dist/$RELEASE_VERSION"
          sha256sum --check SHA256SUMS
          args=()
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Gatehouse $RELEASE_TAG" \
            --generate-notes \
            "${args[@]}"
