name: Documentation
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/*docs*.py'
      - '.github/workflows/docs.yml'
      - 'packaging/versioning.py'
  pull_request:
    paths:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/*docs*.py'
      - '.github/workflows/docs.yml'
      - 'packaging/versioning.py'
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version validated by Release CI
        required: true
        type: string
      channel:
        description: release or prerelease
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation tools
        run: python -m pip install -r requirements-docs.txt
      - name: Read latest published download version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.error, urllib.request
          path = pathlib.Path('build/latest-release.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          url = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/releases/latest'
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
          })
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  release = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              release = {}
          path.write_text(json.dumps(release), encoding='utf-8')
          PY
      - name: Prepare and validate documentation
        env:
          DOCS_VERSION: ${{ inputs.version }}
          DOCS_CHANNEL: ${{ inputs.channel || 'development' }}
        run: |
          python scripts/test_docs.py
          python scripts/prepare_docs.py
          python -m mkdocs build --strict
          python scripts/check_docs.py
          python - <<'PY'
          import json, os, pathlib
          data = json.loads(pathlib.Path('build/docs-metadata.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Documentation: ' + data['docs_version'] + ' (' + data['docs_channel'] + ')\n\n')
              summary.write('Installation example: ' + data['download_version'] + '\n')
          PY
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/docs-site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
